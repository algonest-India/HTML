<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table in HTML</title>
</head>
<body>
    <h1>Sample Table</h1>
    <table border="0" cellspacing="10" cellpadding="10">
        <tr>
            <th>Name</th>
            <th>Course</th>
            <th>Duration</th>
        </tr>
        <tr>
            <td>Parm </td>
            <td>Web Development</td>
            <td>3 Month</td>
        </tr>
        <tr>
            <td>Ravi</td>
            <td>Python</td>
            <td>45 Days</td>
        </tr>
</body>
</html>
